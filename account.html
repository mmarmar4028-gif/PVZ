<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Личный кабинет · Защита ПВЗ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230047BB'/%3E%3Ccircle cx='23' cy='9' r='3.5' fill='%23FA843C'/%3E%3C/svg%3E">
</head>
<body data-page="account" data-footer="off" data-bot="off">
<main>
  <div id="login" class="login" hidden>
    <div class="card" style="padding:32px">
      <div class="eyebrow">Личный кабинет</div>
      <h1 style="font-size:30px;margin:10px 0 12px">Вход в кабинет</h1>
      <p class="muted" id="loginText">Кабинет открывается после подключения. Пока можно посмотреть демо-версию с примерными данными.</p>
      <div style="display:grid;gap:10px;margin-top:24px">
        <button class="btn btn-block" type="button" id="enterDemo">Открыть демо-кабинет</button>
        <a class="btn btn-ghost btn-block" href="apply.html">Оставить заявку на подключение</a>
      </div>
      <p class="hint" style="margin-top:16px">Демо-режим: данные кабинета хранятся только в этом браузере.</p>
    </div>
  </div>

  <div id="app" class="container acc" hidden>
    <nav class="side" aria-label="Разделы кабинета" id="side"></nav>
    <div id="view" style="min-width:0"></div>
  </div>
</main>
<div id="modal" class="modal" hidden><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header><h3 id="modalTitle"></h3><button class="bot-close" style="color:var(--ink)" type="button" id="modalClose" aria-label="Закрыть">×</button></header><div id="modalBody"></div></div></div>
<script src="assets/app.js"></script>
<script src="assets/tools.js"></script>
<script src="assets/account.js"></script>
</body>
</html>
